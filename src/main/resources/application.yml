server:
    tomcat:
        basedir: tomcat
        accesslog:
            enabled: true
            pattern: "%t %a %r %s (%D microseconds)"
            encoding: UTF-8
            rotate: true
        uri-encoding: UTF-8
    shutdown: graceful


spring:
    application:
        name: mybatis
    datasource:
        driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
        url: jdbc:log4jdbc:oracle:thin:@localhost:1521:ORCL
        username: MYBATIS_USER
        password: iit3274
        hikari:
            maximum-pool-size: 5

mybatis:
    configuration:
        map-underscore-to-camel-case: true
    mapper-locations: /mapper/**/*.xml
    type-aliases-package: com.example.**.vo,com.example.**.dto,com.example.**.entity
    type-handlers-package: com.example.mybatis.config.typeHandler

